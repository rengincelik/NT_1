<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Narcolepsy</title>
	<meta name="description" content="A 2-minute narcolepsy screening (Swiss Narcolepsy Scale).">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Narkolepsi Testi">
	<meta property="og:title" content="Narkolepsi Testi">
	<meta property="og:description" content="Yaklaşık 2 dakikalık uyku taraması. Cevapların hiçbir yere kaydedilmez.">
	<meta property="og:url" content="https://rengincelik.github.io/NT_1/">
	<meta property="og:image" content="https://rengincelik.github.io/NT_1/assets/og-image.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Narkolepsi Testi, yaklaşık 2 dakikalık uyku taraması">
	<meta property="og:locale" content="tr_TR">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Narkolepsi Testi">
	<meta name="twitter:description" content="Yaklaşık 2 dakikalık uyku taraması. Cevapların hiçbir yere kaydedilmez.">
	<meta name="twitter:image" content="https://rengincelik.github.io/NT_1/assets/og-image.png"><!-- Kayıtlı tema seçimini CSS'ten önce uygular (açılışta beyaz/koyu çakmasını önler). Seçim yoksa sistem ayarı geçerli. -->
	<script>try{var th=localStorage.getItem("theme");if(th==="dark"||th==="light")document.documentElement.dataset.theme=th}catch(e){}</script>
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/layout.css">
	<link rel="stylesheet" href="css/components.css">
</head>
<body>
<!-- Arka plan katmanı: ileride shader/canvas buraya takılabilir -->
<div class="bg" id="bg" aria-hidden="true"></div>

<!--
  Metinler js/locales/*.js dosyalarından gelir (data-i18n anahtarları).
  Buradaki İngilizce metinler JS yüklenmeden önce / JS kapalıyken görünen yedektir.
-->
<header class="site-header">
	<div class="container header-inner">
		<a href="#home" class="brand" data-i18n="site.name"></a>
		<nav class="site-nav" data-i18n-aria-label="nav.aria" aria-label="Main menu">
			<a href="#home" data-i18n="nav.home"></a>
			<a href="#about" data-i18n="nav.about"></a>
			<a href="#narcolepsy" data-i18n="nav.narcolepsy"></a>
			<a href="#test" data-i18n="nav.test"></a>
		</nav>
		<div class="header-tools">
			<div class="lang-list" id="lang-list" role="group" data-i18n-aria-label="lang.label" aria-label="Language"></div>
			<!-- theme.js açar ve aria-pressed'i yönetir; JS kapalıyken gizli kalır -->
			<button type="button" class="theme-btn" id="theme-btn" aria-pressed="false" data-i18n-aria-label="theme.toggle" aria-label="Dark theme" title="Dark theme" hidden>
				<svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
				<svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
		</div>
	</div>
</header>

<main>
	<!-- HOME -->
	<section id="home" class="section section-first">
		<div class="container hero">
			<h1 class="hero-title" data-i18n="home.title" data-i18n-html></h1>			<h3 class="hero-subtitle" data-i18n="home.subtitle"></h3>
			<div class="row">
				<a class="btn" href="#test" data-i18n="home.start"></a>
				<a class="btn btn-ghost" data-share-whatsapp data-i18n="share.button"></a>
			</div>
			<!-- stats.js doldurur; sayaç kapalıysa ya da veri gelmezse gizli kalır -->
			<div class="stats" id="stats" hidden>
				<div class="stat">
		<span class="stat-icon" aria-hidden="true">
			<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
		</span>
					<span class="stat-num" id="stat-views"></span>
					<span class="stat-label" data-i18n="home.views"></span>
				</div>
				<div class="stat">
		<span class="stat-icon" aria-hidden="true">
			<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>
		</span>
					<span class="stat-num" id="stat-tests"></span>
					<span class="stat-label" data-i18n="home.tests"></span>
				</div>
			</div>
		</div>
	</section>
	
	<!-- ABOUT -->
	<section id="about" class="section">
		<div class="container">
			<div class="scroll-box" data-rich-block="about" tabindex="0" role="region" data-i18n-aria-label="nav.about" aria-label="About me">
				<h2 class="lead" data-i18n-rich="about.lead"></h2>
				<p class="big" data-i18n-rich="about.big"></p>
				<p data-i18n-rich="about.p1"></p>
				<p data-i18n-rich="about.p2"></p>
				<div class="refs" data-refs hidden></div>
			</div>
		</div>
	</section>
	
	<!-- NARCOLEPSY -->
	<section id="narcolepsy" class="section">
		<div class="container">
			<h2 id="narcolepsy-title" data-i18n="narcolepsy.title"></h2>
			<div class="scroll-box" data-rich-block="narcolepsy" tabindex="0" role="region" aria-labelledby="narcolepsy-title">
				<div data-i18n-rich-list="narcolepsy.body"></div>
				<div class="refs" data-refs hidden></div>
			</div>
		</div>
	</section>
	
	<!-- TEST -->
	<section id="test" class="section">
		<div class="container">
			<h2 id="test-title" data-i18n="test.title"></h2>
			<!-- testswitch.js doldurur; tek test varsa gizli kalır -->
			<div class="row" id="test-switch" role="group" data-i18n-aria-label="test.switchLabel" aria-label="Choose a test" hidden></div>
			<!-- main.js seçili testin alt başlığını yazar (tests.<id>.subtitle) -->
			<p class="muted" id="test-subtitle"></p>
			
			<div id="quiz-panel" class="panel">
				<!-- main.js yazar (tests.<id>.intro[]), yönergesi olmayan testte gizli kalır -->
				<div id="test-intro" class="muted" hidden></div>
				
				<div class="progress">
					<p id="progress-text" class="progress-text" aria-live="polite"></p>
					<div id="progress-bar" class="progress-bar" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
						<span id="progress-fill"></span>
					</div>
				</div>
				
				<div id="quiz-viewport" class="viewport">
					<div id="quiz-track" class="track"></div>
				</div>
				
				<div class="quiz-nav">
					<button type="button" id="prev-btn" class="btn btn-ghost" data-i18n="test.prev"></button>
					<button type="button" id="next-btn" class="btn" data-i18n="test.next"></button>
				</div>
				<!-- quiz.js yazar (test.tip, {max} = seçenek sayısı), bu yüzden data-i18n yok -->
				<p id="quiz-tip" class="muted tip"></p>
			</div>
			
			<div id="result-panel" class="panel" hidden>
				<div class="scratch-card">
					<div id="result-content" class="scratch-content"></div>
					<canvas id="scratch" aria-hidden="true"></canvas>
				</div>
				<p id="scratch-hint" class="muted center" data-i18n="result.hint"></p>
				<div class="center">
					<button type="button" id="skip-scratch" class="btn btn-ghost" data-i18n="result.skip"></button>
				</div>
				
				<div id="result-actions" class="result-actions" hidden>
					<div class="row">
						
						<a class="btn btn-ghost" data-share-whatsapp data-i18n="share.button"></a>
					</div>
					
					<div class="row">
						<button type="button" id="edit-btn" class="btn btn-ghost" data-i18n="result.edit"></button>
						<button type="button" id="restart-btn" class="btn btn-ghost" data-i18n="result.restart"></button>
					</div>
				</div>
				
			</div>
			
			<!-- main.js yazar (tests.<id>.copyright), telif satırı olmayan testte gizli kalır -->
			<p id="test-copyright" class="muted tip" hidden></p>
		</div>
	</section>
</main>

<footer class="site-footer" id="footer"></footer>

<noscript><p class="container">JavaScript is required for the test.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
